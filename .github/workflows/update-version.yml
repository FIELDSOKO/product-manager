name: Update version.json and fallback version

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version.json'
  workflow_dispatch:

concurrency:
  group: update-version-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version.json and fallback version
        run: |
          VERSION=$(TZ='Asia/Tokyo' date '+%Y.%m.%d.%H%M%S')
          printf '{\n  "version": "%s"\n}\n' "$VERSION" > version.json

          python3 - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          script_path = Path("script.js")
          script = script_path.read_text(encoding="utf-8")
          pattern = r'(const APP_VERSION = window\.__APP_VERSION \|\| ")[^"]*(";)'
          updated, count = re.subn(pattern, rf'\g<1>{version}\g<2>', script, count=1)
          if count != 1:
              raise SystemExit("APP_VERSION fallback was not found exactly once in script.js")
          script_path.write_text(updated, encoding="utf-8")
          PY

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Commit and push with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- version.json script.js; then
            echo "version.json and script.js have no changes."
            exit 0
          fi

          git add version.json script.js
          git commit -m "chore: update version and fallback ${VERSION} [skip actions]"

          for i in 1 2 3; do
            git fetch origin main
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "Push failed after retries."
          exit 1
