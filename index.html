  <style>
    body.loading-active {
      background: #000000;
      overflow: hidden;
    }

    body.loading-active .app,
    body.loading-active .scanner,
    body.loading-active .modalBack {
      visibility: hidden;
    }

    #bootLoadingScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    #bootLoadingScreen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .bootLoadingInner {
      width: min(78vw, 330px);
      text-align: center;
    }

    .bootLogoWrap {
      position: relative;
      width: min(54vw, 220px);
      height: min(54vw, 220px);
      margin: 0 auto 22px;
    }

    .bootLogoRingLayer,
    .bootLogoRingGlow,
    .bootLogoRing,
    .bootLogoSparkLayer,
    .bootLogoCenter {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .bootLogoRingLayer {
      animation: bootRingRotate 9s linear infinite;
      z-index: 1;
    }

    .bootLogoRing,
    .bootLogoRingGlow,
    .bootLogoCenter {
      object-fit: contain;
      image-rendering: auto;
    }

    .bootLogoCenter {
      z-index: 4;
    }

    .bootLoadingText {
      color: #eefaff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-shadow: 0 0 10px rgba(120, 210, 255, 0.7);
      animation: bootTextBlink 1.8s ease-in-out infinite;
    }

    .bootProgressText {
      margin-top: 8px;
      color: #ccefff;
      font-size: 14px;
      font-weight: 900;
      text-shadow: 0 0 8px rgba(60, 170, 255, 0.65);
    }

    .bootProgressBlocks {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-top: 14px;
    }

    .bootProgressBlocks span {
      display: block;
      height: 13px;
      border-radius: 3px;
      background: rgba(20, 55, 80, 0.72);
      box-shadow: inset 0 0 0 1px rgba(80, 170, 230, 0.22);
    }

    .bootProgressBlocks span.on {
      background: #14b8ff;
      box-shadow: 0 0 8px rgba(20, 184, 255, 0.95), 0 0 16px rgba(20, 184, 255, 0.52);
    }

    @keyframes bootRingRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes bootBlueGlowBreath {
      0%, 100% {
        opacity: 0.54;
        filter:
          saturate(1.28)
          drop-shadow(0 0 15px rgba(18, 170, 255, 0.76))
          drop-shadow(0 0 34px rgba(0, 135, 255, 0.58))
          drop-shadow(0 0 66px rgba(0, 95, 255, 0.40))
          drop-shadow(0 0 96px rgba(0, 70, 220, 0.26));
      }
      48% {
        opacity: 0.98;
        filter:
          saturate(1.58)
          drop-shadow(0 0 26px rgba(55, 210, 255, 1))
          drop-shadow(0 0 58px rgba(0, 160, 255, 0.86))
          drop-shadow(0 0 104px rgba(0, 105, 255, 0.62))
          drop-shadow(0 0 154px rgba(0, 75, 225, 0.38));
      }
      72% {
        opacity: 0.70;
      }
    }

    @keyframes bootBlueSpark {
      0%, 62%, 100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.45);
      }
      68% {
        opacity: calc(var(--spark-peak, 0.86) * 0.42);
        transform: translate(calc(-50% + var(--spark-x1, 1px)), calc(-50% + var(--spark-y1, -1px))) scale(0.78);
      }
      73% {
        opacity: var(--spark-peak, 0.86);
        transform: translate(calc(-50% + var(--spark-x2, -1px)), calc(-50% + var(--spark-y2, 1px))) scale(1.16);
      }
      82% {
        opacity: calc(var(--spark-peak, 0.86) * 0.24);
        transform: translate(calc(-50% + var(--spark-x1, 1px)), calc(-50% + var(--spark-y2, 1px))) scale(1.52);
      }
    }

    @keyframes bootTextBlink {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    #searchLoadingScreen {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.88);
      color: #ffffff;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s ease, visibility 0.15s ease;
    }

    #searchLoadingScreen.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #searchLoadingScreen .bootLoadingInner {
      width: min(66vw, 260px);
    }

    #searchLoadingScreen .bootLogoWrap {
      width: min(42vw, 170px);
      height: min(42vw, 170px);
      margin-bottom: 18px;
    }

    #searchLoadingScreen .bootLoadingText {
      font-size: 16px;
    }

  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script>

    window.__APP_LOADING = (function() {
      var state = {
        version: false,
        css: false,
        js: false,
        master: false,
        hidden: false,
        percent: 0,
        target: 0,
        masterSlowHold: false
      };
      var masterTimer = null;
      var progressTimer = null;
      var completeTimer = null;
      var stageTimers = [];
      var masterWaitTimer = null;
      var masterWaitIndex = 0;
      var progressReady = false;
      var minTimeDone = false;
      var MIN_LOADING_MS = 2900;
      var COMPLETE_HOLD_MS = 800;
      var MASTER_SLOW_COMPLETE_HOLD_MS = 1700;

      function clampPercent(value) {
        value = Number(value || 0);
        if (!isFinite(value)) value = 0;
        return Math.max(0, Math.min(100, value));
      }

      function renderProgress() {
        var percentEl = document.getElementById("bootProgressPercent");
        var blocks = document.querySelectorAll("#bootProgressBlocks span");
        var onCount = Math.ceil(state.percent / 10);

        if (percentEl) percentEl.textContent = Math.round(state.percent) + "%";
        blocks.forEach(function(block, index) {
          block.classList.toggle("on", index < onCount);
        });
      }

      function startProgressAnimation() {
        if (progressTimer) return;
        progressTimer = setInterval(function() {
          if (Math.abs(state.target - state.percent) < 0.5) {
            state.percent = state.target;
            renderProgress();
            if (state.percent >= 100 || state.percent === state.target) {
              clearInterval(progressTimer);
              progressTimer = null;
            }
            return;
          }

          var diff = state.target - state.percent;
          var step = Math.max(0.7, Math.abs(diff) * 0.12);
          state.percent += diff > 0 ? step : -step;

          if (diff > 0 && state.percent > state.target) state.percent = state.target;
          if (diff < 0 && state.percent < state.target) state.percent = state.target;
          renderProgress();
        }, 32);
      }

      function setProgress(value, immediate) {
        var next = clampPercent(value);
        state.target = Math.max(state.target, next);

        if (immediate) {
          state.percent = state.target;
          renderProgress();
          if (progressTimer) {
            clearInterval(progressTimer);
            progressTimer = null;
          }
          return;
        }

        startProgressAnimation();
      }

      function setMasterWaitProgress(value) {
        if (state.hidden || state.master) return;
        state.target = clampPercent(value);
        startProgressAnimation();
      }

      function startMasterWaitAnimation() {
        if (masterWaitTimer || state.hidden || state.master) return;

        var waitValues = [91, 92, 93, 94, 95, 94, 93, 95];
        masterWaitTimer = setInterval(function() {
          if (state.hidden || state.master) {
            clearInterval(masterWaitTimer);
            masterWaitTimer = null;
            return;
          }

          setMasterWaitProgress(waitValues[masterWaitIndex % waitValues.length]);
          masterWaitIndex += 1;
        }, 650);
      }

      function stopMasterWaitAnimation() {
        if (!masterWaitTimer) return;
        clearInterval(masterWaitTimer);
        masterWaitTimer = null;
      }

      function canHide() {
        return minTimeDone && state.version && state.css && state.js && state.master;
      }

      function hideIfReady() {
        if (state.hidden || !canHide()) return;
        state.hidden = true;
        stopMasterWaitAnimation();
        setProgress(100, true);

        if (completeTimer) clearTimeout(completeTimer);
        completeTimer = setTimeout(function() {
          document.body.classList.remove("loading-active");
          var screen = document.getElementById("bootLoadingScreen");
          if (screen) {
            screen.classList.add("hide");
            setTimeout(function() {
              if (screen && screen.parentNode) screen.parentNode.removeChild(screen);
            }, 300);
          }
        }, state.masterSlowHold ? MASTER_SLOW_COMPLETE_HOLD_MS : COMPLETE_HOLD_MS);
      }

      function mark(name) {
        if (!state.hasOwnProperty(name)) return;
        if (name === "master") stopMasterWaitAnimation();
        state[name] = true;

        if (name === "version") setProgress(22);
        if (name === "css") setProgress(50);
        if (name === "js") setProgress(70);
        if (name === "master") setProgress(90);

        hideIfReady();
      }

      function startMasterTimeout() {
        if (masterTimer) return;
        masterTimer = setTimeout(function() {
          state.masterSlowHold = true;
          mark("master");
        }, 4500);
      }

      function finishMaster() {
        if (masterTimer) clearTimeout(masterTimer);
        var updatedAtEl = document.getElementById("updatedAt");
        if (updatedAtEl && updatedAtEl.textContent.indexOf("取得失敗") !== -1) {
          state.masterSlowHold = true;
        }
        mark("master");
      }

      function initProgressDisplay() {
        if (progressReady) return;
        progressReady = true;
        renderProgress();
        setProgress(5);

        [
          { ms: 320, value: 12 },
          { ms: 720, value: 22 },
          { ms: 1120, value: 35 },
          { ms: 1520, value: 50 },
          { ms: 2050, value: 70 },
          { ms: 2600, value: 90 }
        ].forEach(function(stage) {
          stageTimers.push(setTimeout(function() {
            setProgress(stage.value);
            if (stage.value === 90) startMasterWaitAnimation();
          }, stage.ms));
        });

        stageTimers.push(setTimeout(function() {
          minTimeDone = true;
          hideIfReady();
        }, MIN_LOADING_MS));
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initProgressDisplay);
      } else {
        initProgressDisplay();
      }

      return {
        mark: mark,
        startMasterTimeout: startMasterTimeout,
        finishMaster: finishMaster,
        setProgress: setProgress
      };
    })();

    (function() {
      var fallbackVersion = "2026.07.02.13";

      function safeVersion(value) {
        return String(value || fallbackVersion).replace(/[^0-9A-Za-z._-]/g, "");
      }

      function loadAppAssets(version) {
        var v = safeVersion(version);
        window.__APP_VERSION = v;
        if (window.__APP_LOADING) window.__APP_LOADING.mark("version");

        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = "style.css?v=" + encodeURIComponent(v);
        css.onload = function() {
          if (window.__APP_LOADING) window.__APP_LOADING.mark("css");
        };
        css.onerror = function() {
          if (window.__APP_LOADING) window.__APP_LOADING.mark("css");
        };
        document.head.appendChild(css);

        var js = document.createElement("script");
        js.async = false;
        js.src = "script.js?v=" + encodeURIComponent(v);
        js.defer = true;
        js.onload = function() {
          if (window.__APP_LOADING) window.__APP_LOADING.mark("js");
        };
        js.onerror = function() {
          if (window.__APP_LOADING) {
            window.__APP_LOADING.mark("js");
            window.__APP_LOADING.finishMaster();
          }
        };
        document.head.appendChild(js);
      }

      fetch("version.json?ts=" + Date.now(), { cache: "no-store" })
        .then(function(res) {
          if (!res.ok) throw new Error("version.json load error");
          return res.json();
        })
        .then(function(data) {
          loadAppAssets(data && data.version);
        })
        .catch(function() {
          loadAppAssets(fallbackVersion);
        });
    })();
  </script>

      </div>
      <div class="bootLoadingText">Loading...</div>
      <div class="bootProgressText" id="bootProgressPercent">0%</div>
      <div class="bootProgressBlocks" id="bootProgressBlocks" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>


  <div id="searchLoadingScreen" role="status" aria-live="polite" aria-hidden="true">
    <div class="bootLoadingInner">
      <div class="bootLogoWrap" aria-hidden="true">
        <div class="bootLogoRingLayer">
          <img class="bootLogoRingGlow" src="ring.png" alt="">
          <img class="bootLogoRing" src="ring.png" alt="">
          <div class="bootLogoSparkLayer">
            <span class="bootLogoSpark"></span>
            <span class="bootLogoSpark"></span>
            <span class="bootLogoSpark"></span>

  <div class="app" id="app">
    <img class="appLogo" src="logo.png" alt="" onerror="this.style.display='none';">
    <div class="appVersion" id="appVersion"></div>
    <div class="updatedAt" id="updatedAt">商品マスタ更新日時：取得中...</div>

    <div class="card">
      <button class="primary wide" onclick="toggleScanner()">📷 JANスキャン</button>

      <div class="field" style="margin-top:14px;">
        <label>まとめて入力</label>
        <textarea id="textInput" placeholder="例：4901234567890&#10;例：ABC 黒 23cm"></textarea>
        <div class="small">JANだけでも検索できます。品番・品名・色・サイズ・ロケでも検索できます。</div>
      </div>

      <div class="grid">
        <div class="field">
          <label>JAN</label>
          <input id="janInput" inputmode="numeric" placeholder="4901234567890">
        </div>
        <div class="field">
          <label>品番</label>
          <input id="hinbanInput" placeholder="ABC">
        </div>
        <div class="field">
          <label>品名</label>
          <input id="nameInput" placeholder="商品名の一部">
        </div>
        <div class="field">
          <label>色</label>
          <input id="colorInput" placeholder="黒">
        </div>
        <div class="field">
          <label>サイズ</label>
          <input id="sizeInput" placeholder="23cm">
        </div>
        <div class="field">
          <label>ロケ</label>
          <input id="locationInput" placeholder="B-1">
        </div>
      </div>

      <div class="btn-row">
        <button class="primary" onclick="searchProduct()">🔍 検索</button>
        <button class="secondary" onclick="clearAll()">🧹 クリア</button>
      </div>

      <div id="message" class="msg"></div>
    </div>

    <div class="card hidden" id="productCard">
      <button id="backToResultListBtn" class="secondary wide hidden" onclick="backToResultList()">← 一覧に戻る</button>
      <div class="info">
        <div class="key">品番</div><div class="value" id="vHinban"></div>
        <div class="key">品名</div><div class="value" id="vName"></div>
        <div class="key">JAN</div><div class="value" id="vJan"></div>
        <div class="key">色</div><div class="value" id="vColor"></div>
        <div class="key">サイズ</div><div class="value" id="vSize"></div>
      </div>

      <div class="locBox">
        <div class="locLabel">現在ロケ</div>
        <div class="locValue" id="vLocation"></div>
      </div>

      <div class="field" style="margin-top:14px;">
        <label>新ロケ</label>
        <input id="newLocationInput" placeholder="B-3">
      </div>

      <button class="success wide" onclick="openConfirm()">📍 ロケ変更</button>
    </div>

    <div class="card hidden" id="multiCard">
      <div style="font-weight:900;">検索結果</div>
      <div class="small">複数見つかりました。変更したい商品を選んでください。</div>
      <div id="resultList"></div>
    </div>
  </div>



  <div class="scanner" id="scannerBox" aria-hidden="true">
    <video id="readerVideo" playsinline muted></video>
    <div class="scannerGuide" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="scannerControls">
      <button type="button" class="zoomBtn active" id="zoom1Btn" onclick="setZoomLevel(1)">1×</button>
      <button type="button" class="zoomBtn" id="zoom15Btn" onclick="setZoomLevel(1.5)">1.5×</button>
      <button type="button" class="zoomBtn" id="zoom2Btn" onclick="setZoomLevel(2)">2×</button>
      <button type="button" class="zoomBtn" id="zoom3Btn" onclick="setZoomLevel(3)">3×</button>
    </div>
    <button type="button" class="scannerCloseBtn" onclick="closeScannerManual()">✕ 閉じる</button>
    <div class="focusMark" id="focusMark"></div>
  </div>

  <div class="modalBack" id="confirmModal">
    <div class="modal">
      <h2>ロケ変更しますか？</h2>

      <div class="info">
        <div class="key">品番</div><div class="value" id="mHinban"></div>
        <div class="key">品名</div><div class="value" id="mName"></div>
        <div class="key">色</div><div class="value" id="mColor"></div>
        <div class="key">サイズ</div><div class="value" id="mSize"></div>
      </div>

      <div class="locBox">
        <div class="locLabel">現在ロケ</div>
        <div class="locValue" id="mOldLocation"></div>
      </div>

      <div class="arrow">↓</div>

      <div class="locBox">
        <div class="locLabel">変更後ロケ</div>
        <div class="locValue" id="mNewLocation"></div>
      </div>

      <div class="modalBtns">
        <button class="success" onclick="confirmUpdate()">はい</button>
        <button class="secondary" onclick="closeConfirm()">いいえ</button>
      </div>
    </div>
  </div>

  <div class="modalBack" id="completeModal">
    <div class="modal">
      <h2>✅ ロケ変更しました</h2>

      <div class="info">
        <div class="key">品番</div><div class="value" id="cHinban"></div>
        <div class="key">品名</div><div class="value" id="cName"></div>
        <div class="key">色</div><div class="value" id="cColor"></div>
        <div class="key">サイズ</div><div class="value" id="cSize"></div>
      </div>

      <div class="locBox">
        <div class="locLabel">変更前</div>
        <div class="locValue" id="cOldLocation"></div>
      </div>

      <div class="arrow">↓</div>

      <div class="locBox">
        <div class="locLabel">変更後</div>
        <div class="locValue" id="cNewLocation"></div>
      </div>

      <button class="primary wide" onclick="finishComplete()">OK</button>
    </div>
  </div>

</body>
</html>
